<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body class="fondo-acceso">
    <div class="container">
      <div class="row vh-100">
        <div
          class="col-lg-5 d-none d-lg-flex align-items-center justify-content-center panel-vino"
        >
          <div class="text-center text-white px-4">
            <h2>Blog de Baco</h2>
            <p>Tu espacio para descubrir el mundo del vino</p>
          </div>
        </div>
        <div
          class="col-12 col-lg-7 d-flex align-items-center justify-content-center"
        >
          <div style="max-width: 24rem" class="w-100">
            <h2>Recuperar contraseña</h2>
            <p>
              Ingresá tu correo y te vamos a enviar un enlace para crear una
              nueva contraseña.
            </p>
            <form method="get" action="#">
              <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input
                  class="form-control"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="nombre@correo.com"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">
                Enviar enlace
              </button>
            </form>
            <p class="mt-2">
              <a href="login.html">Volver a iniciar sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

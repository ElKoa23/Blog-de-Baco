<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contacto</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/estilos.css" />
  </head>

  <body>
    <div class="container">
      <div class="titulo-contacto">
        <h1>Contacto</h1>
      </div>
      <div class="row">
        <div class="col-12 col-md-6">
          <h2>Contactanos</h2>
          <p>Estamos para responder tus consultas.</p>

          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" />
            </div>

            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" />

            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea class="form-control" id="mensaje" rows="4"></textarea>
            </div>

            <button type="submit" class="btn boton-vino">Enviar mensaje</button>
          </form>
        </div>

        <div class="col-12 col-md-6">
          <h2>Nuestra ubicacion</h2>
          <p class="mb-3">Tucuman, Argentina</p>

          <iframe
            class="mapa"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.105916739557!2d-65.207167!3d-26.836583299999994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sRollingCode%20School!5e0!3m2!1ses-419!2sar!4v1790298911670!5m2!1ses-419!2sar"
            width="100%"
            height="350"
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>
  </body>
</html>

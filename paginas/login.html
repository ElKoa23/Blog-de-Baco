<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body class="fondo-acceso">
    <header>
      <!-- NavBar Genérico -->
      <h2>Navbar</h2>
    </header>
    <main class="container">
      <div class="row">
        <section class="col-12 col-lg-6 d-flex justify-content-center">
          <div class="formulario-login w-100">
            <h1 class="Titulo-login">Bienvenido de nuevo</h1>
            <p>Ingresá tus datos para acceder a tu cuenta</p>

            <form id="form-login" onsubmit="event.preventDefault()">
              <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input
                  class="form-control"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="nombre@correo.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input
                  class="form-control"
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Tu contraseña"
                  autocomplete="current-password"
                  required
                />
              </div>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="recordarme"
                    name="recordarme"
                  />
                  <label class="form-check-label" for="recordarme">
                    Recordarme
                  </label>
                </div>

                <button
                  type="button"
                  class="btn btn-link p-0"
                  data-bs-toggle="modal"
                  data-bs-target="#modalRecuperar"
                >
                  ¿Olvidaste tu contraseña?
                </button>
              </div>

              <button type="submit" class="btn boton-vino w-100">
                Iniciar sesión
              </button>
            </form>

            <p class="text-center my-4">O continuá con</p>

            <div class="row">
              <div class="col-12 col-lg-6">
                <button type="button" class="btn btn-outline-secondary w-100">
                  Google
                </button>
              </div>

              <div class="col-12 col-lg-6">
                <button type="button" class="btn btn-outline-secondary w-100">
                  Facebook
                </button>
              </div>
            </div>
            <p class="text-center my-4">
              No tienes cuenta? <a href="../404.html">Regístrate</a>
            </p>
          </div>
        </section>

        <!-- La imagen se oculta en celulares y aparece junto al formulario desde pantallas grandes. -->
        <aside class="col-12 col-lg-6 d-none d-lg-block">
          <div class="card bg-dark text-white w-100">
            <img
              src="https://plus.unsplash.com/premium_photo-1719997502353-88e25b8f266c?w=800&auto=format&fit=crop&q=80"
              class="card-img imagen-login opacity-50"
              alt="Copa de vino en un viñedo"
            />

            <div
              class="card-img-overlay d-flex flex-column justify-content-end text-center"
            >
              <!-- El card-img-overlay es el que deja superponer texto a una imagen -->
              <p class="card-title h4 text-white mb-4">
                "El vino nos conecta con lo esencial"
              </p>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <!-- Modal para recuperar contraseña -->
    <div
      class="modal fade"
      id="modalRecuperar"
      aria-labelledby="tituloRecuperar"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="tituloRecuperar">
              Recuperar contraseña
            </h2>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <p>
              Ingresá tu correo para solicitar un enlace con el que puedas crear
              una nueva contraseña.
            </p>

            <form id="form-recuperar">
              <div class="mb-3">
                <label for="email-recuperar" class="form-label">
                  Correo electrónico
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email-recuperar"
                  name="email"
                  placeholder="nombre@correo.com"
                  autocomplete="email"
                  required
                />
              </div>

              <button type="submit" class="btn boton-vino w-100">
                Enviar enlace
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- Inicio del Footer -->
    <footer></footer>
    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

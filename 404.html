<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/estilos.css" />
  </head>
  <body class="pagina-error">
    <main
      class="container min-vh-100 d-flex align-items-center justify-content-center py-5"
    >
      <section
        class="error-contenido text-center"
        aria-labelledby="titulo-error"
      >
        <p class="error-marca mb-3">Entre Copas</p>

        <div class="" aria-hidden="true">
          <span class="error-copa">🍷</span>
          <span class="error-numero">404</span>
        </div>

        <h1 id="titulo-error" class="error-titulo">
          ¡Ups! Página no encontrada
        </h1>
        <p class="error-descripcion mx-auto">
          Parece que este vino que buscás no existe o fue trasladada.
        </p>

        <a href="./index.html" class="btn btn-error mt-3">Volver al inicio</a>
      </section>
    </main>
  </body>
</html>

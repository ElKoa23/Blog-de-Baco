<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomePage | Baco</title>
    <!-- Css Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Css Propio -->
    <link rel="stylesheet" href="./css/estilos.css" />
  </head>
  <body>
    <header>
      <!-- NavBar Genérico -->
      <h2>Navbar</h2>
    </header>
    <!-- Fin del NavBar genérico-->
    <!-- Inciio del Contenido -->
    <!-- Carrusel -->
    <main>
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner img-carousel">
          <div class="carousel-item active">
            <img
              src="https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?w=1600&auto=format&fit=crop&q=80&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8dmlub3xlbnwwfHwwfHx8MA%3D%3D"
              class="d-block w-100"
              alt="Slide 1 : Copa de Vino tinto y atras un viñedo"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.unsplash.com/photo-1568213816046-0ee1c42bd559?w=1600&auto=format&fit=crop&q=80&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mjd8fHZpbm98ZW58MHx8MHx8fDA%3D"
              class="d-block w-100"
              alt="Slide 2 : Copas de Vino "
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.unsplash.com/photo-1543418219-44e30b057fea?w=1600&auto=format&fit=crop&q=80&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NTh8fHZpbm98ZW58MHx8MHx8fDA%3D"
              class="d-block w-100"
              alt="Slide 3 : Viñedo con uvas"
            />
          </div>
        </div>

        <!-- Texto en imagen -->
        <div class="carousel-caption text-start">
          <h1>Descubrí el mundo del vino</h1>
          <p>Historias, cepas, destinos y experiencias para brindar.</p>
          <a href="#" class="btn btn-danger"> Explorar el blog </a>
        </div>
        <!-- Fin de Texto en Imagen -->

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </main>

    <!-- Inicio del Footer -->
    <footer></footer>
    <!-- Scripts Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
